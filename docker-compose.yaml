services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./backend/services/docker/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    image: ghcr.io/suna-ai/suna-backend:latest
    platform: linux/amd64
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      REDIS_SSL: "False"
      # LLM / Providers (ajuste conforme usar)
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      # Supabase
      SUPABASE_URL: "${SUPABASE_URL}"
      SUPABASE_ANON_KEY: "${SUPABASE_ANON_KEY}"
      SUPABASE_SERVICE_ROLE_KEY: "${SUPABASE_SERVICE_ROLE_KEY}"
      # Opcionais
      TAVILY_API_KEY: "${TAVILY_API_KEY:-}"
      FIRECRAWL_API_KEY: "${FIRECRAWL_API_KEY:-}"
      QSTASH_TOKEN: "${QSTASH_TOKEN:-}"
    depends_on:
      redis:
        condition: service_healthy

  worker:
    image: ghcr.io/suna-ai/suna-backend:latest
    platform: linux/amd64
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uv run dramatiq --skip-logging --processes 4 --threads 4 run_agent_background
    environment:
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      REDIS_SSL: "False"
      # LLM / Providers
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      # Supabase
      SUPABASE_URL: "${SUPABASE_URL}"
      SUPABASE_ANON_KEY: "${SUPABASE_ANON_KEY}"
      SUPABASE_SERVICE_ROLE_KEY: "${SUPABASE_SERVICE_ROLE_KEY}"
      # Opcionais
      TAVILY_API_KEY: "${TAVILY_API_KEY:-}"
      FIRECRAWL_API_KEY: "${FIRECRAWL_API_KEY:-}"
      QSTASH_TOKEN: "${QSTASH_TOKEN:-}"
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # URL interna para o backend (rede do compose)
      NEXT_PUBLIC_BACKEND_URL: "http://backend:8000"
      # Supabase (frontend precisa das públicas)
      NEXT_PUBLIC_SUPABASE_URL: "${SUPABASE_URL}"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "${SUPABASE_ANON_KEY}"
    depends_on:
      - backend

volumes:
  redis_data:
